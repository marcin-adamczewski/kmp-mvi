name: Publish
on:
  push:
jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Publish to MavenCentral
        run: |
          # Use the heredoc <<EOF syntax to handle multi-line content correctly
          echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF" >> $GITHUB_ENV
          echo "${{ secrets.TEST_SECRET }}" | base64 -D >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "$ORG_GRADLE_PROJECT_signingInMemoryKey"

