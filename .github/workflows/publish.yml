name: Publish
on:
  push:
jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Publish to MavenCentral
        run: |
          export ORG_GRADLE_PROJECT_signingInMemoryKey=$(echo "${{ secrets.TEST_DESCRET }}" | base64 -D)
          echo $ORG_GRADLE_PROJECT_signingInMemoryKey

